services:

  db:
    image: postgres:16
    env_file:
      - ../.env_non_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - to_do_lst_db_vol:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_to_do_lst

  back:
    build:
      context: ..
      dockerfile: .docker/DockerfileBack
    env_file:
      - ../.env_non_dev
    command: sh -c "alembic upgrade head && gunicorn back.src.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    pull_policy: always
    volumes:
      - ../back:/app/back
      - ../migrations:/app/migrations
      - ../alembic.ini:/app/alembic.ini

  celery:
    build:
      context: ..
      dockerfile: .docker/DockerfileBack
    env_file:
      - ../.env_non_dev
    command: celery --app=back.src.tasks.emails:celery worker -l INFO
    volumes:
      - ../back:/app/back
    depends_on:
      - redis
      - db

  flower:
    image: mher/flower:0.9.7
    command: ['flower', '--broker=redis://redis:6379', '--port=5555']
    ports:
      - "5557:5555"
    depends_on:
      - redis

  frontend:
    build:
      context: ..
      dockerfile: .docker/DockerfileFront
    ports:
      - "4200:4200"
    restart: unless-stopped
    volumes:
      - ../front:/app/front

volumes:
  to_do_lst_db_vol:

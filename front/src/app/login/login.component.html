<div class="login-container">
  <div class="top"></div>
  <div class="bottom"></div>
  <div class="center">
    <h1>Вход</h1>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <div class="error-message" *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.touched">
          Обязательное поле
        </div>
        <div class="error-message" *ngIf="loginForm.get('email')?.errors?.['email'] && loginForm.get('email')?.touched">
          Введите корректный email
        </div>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <div class="error-message" *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
          Обязательное поле
        </div>
      </div>

      <button type="submit" [disabled]="!loginForm.valid" class="submit-button">
        Войти
      </button>

      <div class="register-link">
        Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a>
      </div>
    </form>
  </div>
</div>
